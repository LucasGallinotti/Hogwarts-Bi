<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 112" width="1280" height="112">
  <!-- Cabecera original: cielo nocturno, castillo gótico en silueta, velas flotantes y filete dorado. -->
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1324"/>
      <stop offset="1" stop-color="#0A0E17"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.18" cy="0.45" r="0.35">
      <stop offset="0" stop-color="#F3D79B" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#F3D79B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="piedra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26304D"/>
      <stop offset="1" stop-color="#121829"/>
    </linearGradient>
    <linearGradient id="filete" x1="0" x2="1">
      <stop offset="0" stop-color="#D9B66F" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#D9B66F" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#F3D79B" stop-opacity="0.9"/>
      <stop offset="0.8" stop-color="#D9B66F" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#D9B66F" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="llama">
      <stop offset="0" stop-color="#FFF4D6"/>
      <stop offset="0.45" stop-color="#FFC66B"/>
      <stop offset="1" stop-color="#FF9A3C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="luzVela">
      <stop offset="0" stop-color="#FFC66B" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFC66B" stop-opacity="0"/>
    </radialGradient>
    <g id="vela">
      <circle cx="0" cy="-4" r="12" fill="url(#luzVela)"/>
      <ellipse cx="0" cy="-3" rx="2.4" ry="4.2" fill="url(#llama)"/>
      <rect x="-2" y="1" width="4" height="13" rx="1" fill="#E8DFC9"/>
    </g>
  </defs>
  <rect width="1280" height="112" fill="url(#cielo)"/>
  <rect width="1280" height="112" fill="url(#halo)"/>

  <!-- Estrellas -->
  <g fill="#F3E6C8">
    <circle cx="612" cy="18" r="0.9" opacity="0.7"/><circle cx="668" cy="40" r="0.7" opacity="0.5"/>
    <circle cx="702" cy="12" r="1" opacity="0.8"/><circle cx="745" cy="30" r="0.6" opacity="0.5"/>
    <circle cx="790" cy="54" r="0.8" opacity="0.6"/><circle cx="1020" cy="8" r="0.7" opacity="0.6"/>
    <circle cx="1105" cy="58" r="0.9" opacity="0.6"/><circle cx="1170" cy="10" r="0.8" opacity="0.7"/>
    <circle cx="1238" cy="64" r="1" opacity="0.6"/><circle cx="560" cy="46" r="0.7" opacity="0.4"/>
    <circle cx="905" cy="56" r="0.6" opacity="0.5"/><circle cx="960" cy="10" r="0.8" opacity="0.5"/>
  </g>
  <!-- Luna creciente -->
  <path d="M1196 32a14 14 0 1 0 12 22a11 11 0 1 1 -12 -22z" fill="#EDE2C4" opacity="0.75"/>

  <!-- Castillo: torres traseras (más claras) -->
  <g fill="#1B2338" opacity="0.95">
    <rect x="742" y="70" width="14" height="42"/><path d="M738 70 L749 42 L760 70 Z"/>
    <rect x="884" y="62" width="16" height="50"/><path d="M880 62 L892 30 L904 62 Z"/>
    <rect x="1046" y="66" width="14" height="46"/><path d="M1042 66 L1053 38 L1064 66 Z"/>
  </g>
  <!-- Castillo: cuerpo principal -->
  <g fill="url(#piedra)" stroke="#4A5677" stroke-width="0.6" stroke-opacity="0.7">
    <rect x="640" y="84" width="60" height="28"/>
    <rect x="690" y="74" width="18" height="38"/><path d="M686 74 L699 50 L712 74 Z"/>
    <rect x="770" y="80" width="90" height="32"/><path d="M770 80 L815 60 L860 80 Z"/>
    <rect x="852" y="56" width="22" height="56"/><path d="M848 56 L863 18 L878 56 Z"/>
    <rect x="910" y="72" width="70" height="40"/>
    <rect x="968" y="48" width="26" height="64"/><path d="M964 48 L981 10 L998 48 Z"/>
    <rect x="1000" y="80" width="80" height="32"/>
    <rect x="1078" y="62" width="20" height="50"/><path d="M1074 62 L1088 30 L1102 62 Z"/>
    <rect x="1110" y="86" width="90" height="26"/>
    <rect x="1198" y="70" width="16" height="42"/><path d="M1194 70 L1206 46 L1218 70 Z"/>
    <path d="M640 84h4v-4h4v4h4v-4h4v4h4v-4h4v4h4v-4h4v4h4v-4h4v4h4v-4h4v4h4v-4h4v4h4v-4h4v4H640z"/>
    <path d="M910 72h4v-4h4v4h4v-4h4v4h4v-4h4v4h4v-4h4v4h4v-4h4v4h4v-4h4v4h4v-4h4v4h4v-4h4v4H910z"/>
  </g>
  <!-- Ventanas encendidas -->
  <g fill="#E9B866">
    <rect x="796" y="90" width="3" height="7" rx="1.5" opacity="0.9"/><rect x="806" y="90" width="3" height="7" rx="1.5" opacity="0.8"/>
    <rect x="816" y="90" width="3" height="7" rx="1.5" opacity="0.9"/><rect x="826" y="90" width="3" height="7" rx="1.5" opacity="0.7"/>
    <rect x="861" y="70" width="4" height="7" rx="2" opacity="0.8"/><rect x="861" y="88" width="4" height="7" rx="2" opacity="0.6"/>
    <rect x="979" y="62" width="4" height="8" rx="2" opacity="0.9"/><rect x="979" y="82" width="4" height="8" rx="2" opacity="0.7"/>
    <rect x="1086" y="76" width="4" height="7" rx="2" opacity="0.8"/><rect x="697" y="86" width="3" height="6" rx="1.5" opacity="0.7"/>
    <rect x="940" y="86" width="3" height="7" rx="1.5" opacity="0.6"/><rect x="1140" y="94" width="3" height="6" rx="1.5" opacity="0.7"/>
  </g>
  <!-- Velas flotantes (lejos del título) -->
  <use href="#vela" x="612" y="62" opacity="0.85"/>
  <use href="#vela" x="760" y="22" opacity="0.7" transform="scale(1)"/>
  <use href="#vela" x="930" y="30" opacity="0.6"/>
  <use href="#vela" x="1150" y="44" opacity="0.75"/>
  <use href="#vela" x="1250" y="24" opacity="0.6"/>
  <!-- Filete dorado con rombo central -->
  <rect x="0" y="110" width="1280" height="1.2" fill="url(#filete)"/>
  <path d="M640 105 L645 110.6 L640 116 L635 110.6 Z" fill="#F3D79B"/>
</svg>
